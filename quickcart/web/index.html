<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuickCart: the demo food shop whose checkout is released with CanaryShield." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23158059'/%3E%3Cpath d='M9 11h2l2 9h8l2-6H12' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='14' cy='24' r='1.6' fill='white'/%3E%3Ccircle cx='20' cy='24' r='1.6' fill='white'/%3E%3C/svg%3E" />
    <title>QuickCart</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("quickcart.theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
