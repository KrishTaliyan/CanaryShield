<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CanaryShield: progressive delivery control center for feature flags, canary rollouts and automatic rollback." />
    <title>CanaryShield</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231B3668'/%3E%3Cpath d='M16 6l8 3.5v6c0 5-3.4 8.9-8 10.5-4.6-1.6-8-5.5-8-10.5v-6z' fill='%232DD4BF'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so there is no light flash.
      (function () {
        var mode = "system";
        try { mode = localStorage.getItem("canaryshield.theme") || "system"; } catch (e) {}
        var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
